syntax = "proto3";

package its;

enum VehicleType {
  VEHICLE_TYPE_UNKNOWN = 0;
  VEHICLE_TYPE_CAR = 1;
  VEHICLE_TYPE_BUS = 2;
  VEHICLE_TYPE_EMERGENCY = 3;
  VEHICLE_TYPE_TRUCK = 4;
  VEHICLE_TYPE_MOTORCYCLE = 5;
  VEHICLE_TYPE_BICYCLE = 6;
}

enum RequestState {
  REQUEST_STATE_UNKNOWN = 0;
  REQUEST_STATE_ACTIVE = 1;
  REQUEST_STATE_CANCELLED = 2;
  REQUEST_STATE_COMPLETED = 3;
}

message SREM {
  string message_id = 1;
  int32 vehicle_id = 2;
  VehicleType vehicle_type = 3;
  RequestState request_state = 4;
  double latitude = 5;
  double longitude = 6;
  float speed = 7;
  bool priority = 8;
  int64 timestamp_ms = 9;
}