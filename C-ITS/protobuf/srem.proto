syntax = "proto3";

package its;

message Srem {
  ItsPduHeader header;

  uint32 generation_delta_time;

  Requestor requestor;
  Request request;
}

message Requestor {
  uint32 station_id;
  VehicleRole role;
  ReferencePosition position;
}

message Request {
  uint32 request_id;
  uint32 intersection_id;
  //PriorityType priority_type;
  //uint32 inbound_lane_id;
  uint32 eta_seconds;
}